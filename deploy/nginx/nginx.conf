events {
    worker_connections 1024;
}

http {
    upstream rollsafe_backend {
        # Initial traffic split: 90% stable (v1), 10% canary (v2)
        server app-stable:8080 weight=9 max_fails=3 fail_timeout=10s;
        server app-canary:8080 weight=1 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost rollsafe.local;

        # Health endpoint for the load balancer
        location /lb-health {
            access_log off;
            return 200 "RollSafe Gateway Healthy\n";
        }

        # Reverse proxy to weighted backends
        location / {
            proxy_pass http://rollsafe_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Aggressive timeouts to prevent cascading failure
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;
        }
    }
}
