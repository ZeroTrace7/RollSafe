apiVersion: v1
kind: Service
metadata:
  name: rollsafe-stable
  namespace: rollsafe
  labels:
    app: rollsafe
    tier: stable
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: rollsafe
---
apiVersion: v1
kind: Service
metadata:
  name: rollsafe-canary
  namespace: rollsafe
  labels:
    app: rollsafe
    tier: canary
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: rollsafe
